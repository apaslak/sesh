# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: sesh-fork

builds:
  - binary: sesh-fork
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - FORK_SETUP.md
      - plugins/opencode-sesh/README.md
      - plugins/opencode-sesh/package.json
      - plugins/opencode-sesh/bun.lock
      - plugins/opencode-sesh/tsconfig.json
      - plugins/opencode-sesh/tui.ts
      - plugins/opencode-sesh/src/*.ts

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: apaslak
    name: sesh
  draft: true
  prerelease: auto
  header: |
    Prebuilt sesh-fork for macOS and Linux (ARM64 and x86-64).
    Each archive includes the matching OpenCode V2 CLI plugin.
    Follow [FORK_SETUP.md](https://github.com/apaslak/sesh/blob/{{ .Tag }}/FORK_SETUP.md).
    No Go toolchain or repository clone required. Setup is manual.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
